name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 从 github.repository（格式 owner/repo）解析出仓库名，
      # 这样仓库改名后无需修改任何配置，重新运行即自动适配新地址。
      - name: Resolve site paths
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          echo "SITE_BASE_PATH=/${REPO_NAME}" >> "$GITHUB_ENV"
          echo "SITE_URL=https://${OWNER,,}.github.io/${REPO_NAME}" >> "$GITHUB_ENV"
          echo "解析结果：base=${REPO_NAME} url=https://${OWNER,,}.github.io/${REPO_NAME}"

      - name: Build static site
        env:
          # 项目站点在 https://<user>.github.io/<repo>/ 下，必须设置子路径
          NEXT_PUBLIC_BASE_PATH: ${{ env.SITE_BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      # enablement: true 会在 Pages 尚未开启时自动启用（Source = GitHub Actions），
      # 省去手动去 Settings → Pages 点一遍。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
